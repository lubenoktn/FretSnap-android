plugins {
    id "com.android.application"
}

android {
    namespace = "sk.lubeno.riffy"
    compileSdk = 35
    ndkVersion = "30.0.16248370"

    defaultConfig {
        applicationId = "sk.lubeno.riffy"
        minSdk = 29
        targetSdk = 35
        versionCode = 9
        versionName = "1.7"
        ndk {
            abiFilters "arm64-v8a", "armeabi-v7a"
        }
    }

    buildTypes {
        release {
            minifyEnabled = true
            shrinkResources = true
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
            // Aplikácia nejde do obchodu, stačí ladiaci podpis; aktualizácie sa potom nainštalujú cez starú verziu.
            signingConfig = signingConfigs.debug
        }
    }

    // Skomprimovaný kód: menší súbor na prenos do telefónu.
    packaging {
        dex {
            useLegacyPackaging = true
        }
    }

    // Vlastný ovládač USB zvuku (jni/usbaudio.c).
    externalNativeBuild {
        ndkBuild {
            path = file("src/main/jni/Android.mk")
        }
    }

    lint {
        // Aplikácia je len po slovensky (preklady ani rozloženie sprava doľava nie sú potrebné);
        // obrazovka má zámerne všetko v jednom rozložení.
        disable += ["SetTextI18n", "HardcodedText", "OldTargetApi", "GradleDependency", "ButtonStyle",
                    "RtlHardcoded", "RtlSymmetry", "MergeRootFrame", "TooManyViews", "NestedWeights"]
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
}

dependencies {
    testImplementation "junit:junit:4.13.2"
}
