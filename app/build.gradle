plugins {
    id "com.android.application"
}

android {
    namespace = "sk.lubeno.riffy"
    compileSdk = 35

    defaultConfig {
        applicationId = "sk.lubeno.riffy"
        minSdk = 29
        targetSdk = 35
        versionCode = 1
        versionName = "1.0"
    }

    buildTypes {
        release {
            minifyEnabled = true
            shrinkResources = true
            // Aplikácia nejde do obchodu, stačí ladiaci podpis; aktualizácie sa potom nainštalujú cez starú verziu.
            signingConfig = signingConfigs.debug
        }
    }

    // Skomprimovaný kód: menší súbor na prenos do telefónu.
    packaging {
        dex {
            useLegacyPackaging = true
        }
    }

    lint {
        // Aplikácia je len po slovensky, preklady nie sú potrebné.
        disable += ["SetTextI18n", "HardcodedText", "OldTargetApi", "GradleDependency"]
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
}
